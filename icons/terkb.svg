<?xml version="1.0" encoding="UTF-8"?>
<!-- Иконка terkb: две половины клавиатуры по краям, терминал между ними —
     то же, что видно в окне. Деталей намеренно мало: на 16 пикселях клавиши
     сливаются в текстуру, и узнаваемым остаётся силуэт «полосы по бокам,
     тёмное окно в середине». -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4e"/>
      <stop offset="1" stop-color="#272b36"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15171d"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>

  <!-- корпус; светлый кант — чтобы на тёмном фоне иконка не сливалась в пятно -->
  <rect x="5.5" y="11.5" width="117" height="105" rx="14.5" fill="url(#body)"
        stroke="#79839a" stroke-width="3"/>

  <!-- экран терминала -->
  <rect x="45" y="20" width="38" height="88" rx="5" fill="url(#glass)"/>
  <!-- приглашение и курсор: единственная яркая деталь, видна и в мелком размере -->
  <path d="M53 36 l7 6 -7 6" fill="none" stroke="#50fa7b" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="38" width="12" height="5" rx="2.5" fill="#50fa7b"/>
  <g fill="#6a7385">
    <rect x="53" y="54" width="23" height="4.5" rx="2.25"/>
    <rect x="53" y="65" width="16" height="4.5" rx="2.25"/>
    <rect x="53" y="76" width="20" height="4.5" rx="2.25"/>
    <rect x="53" y="87" width="11" height="4.5" rx="2.25"/>
  </g>

  <!-- левая половина клавиатуры -->
  <g fill="#596376">
    <rect x="12" y="30" width="24" height="12" rx="3.5"/>
    <rect x="12" y="46" width="24" height="12" rx="3.5"/>
    <rect x="12" y="62" width="24" height="12" rx="3.5"/>
    <rect x="12" y="78" width="24" height="12" rx="3.5"/>
    <rect x="12" y="94" width="24" height="12" rx="3.5"/>
  </g>

  <!-- правая половина: нижняя клавиша выделена — там Enter -->
  <g fill="#596376">
    <rect x="92" y="30" width="24" height="12" rx="3.5"/>
    <rect x="92" y="46" width="24" height="12" rx="3.5"/>
    <rect x="92" y="62" width="24" height="12" rx="3.5"/>
    <rect x="92" y="78" width="24" height="12" rx="3.5"/>
  </g>
  <rect x="92" y="94" width="24" height="12" rx="3.5" fill="#7c6cf0"/>
</svg>
