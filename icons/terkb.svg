<?xml version="1.0" encoding="UTF-8"?>
<!-- Иконка terkb: две половины клавиатуры по краям, терминал между ними —
     то же, что видно в окне. Корпус светлый и цветной намеренно: тёмно-серый
     сливался с фоном дока, и закреплённый значок выглядел чёрным пятном.
     Деталей мало: на 16 пикселях клавиши сходятся в текстуру, и узнаваемым
     остаётся силуэт «полосы по бокам, тёмное окно в середине».
     Рисунок повторяет make-icons.py — правя одно, правьте и другое. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d6cf2"/>
      <stop offset="1" stop-color="#4a37c8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b22"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>

  <!-- корпус -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#body)"/>

  <!-- экран терминала -->
  <rect x="47" y="22" width="34" height="84" rx="6" fill="url(#screen)"/>
  <!-- приглашение и курсор: единственная яркая деталь, видна и в мелком размере -->
  <path d="M54 38 l7 7 -7 7" fill="none" stroke="#50fa7b" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="41" width="11" height="5" rx="2.5" fill="#50fa7b"/>
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="54" y="60" width="20" height="4.5" rx="2.25"/>
    <rect x="54" y="71" width="14" height="4.5" rx="2.25"/>
    <rect x="54" y="82" width="17" height="4.5" rx="2.25"/>
    <rect x="54" y="93" width="10" height="4.5" rx="2.25"/>
  </g>

  <!-- левая половина клавиатуры -->
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="14" y="32" width="25" height="12" rx="4"/>
    <rect x="14" y="48" width="25" height="12" rx="4"/>
    <rect x="14" y="64" width="25" height="12" rx="4"/>
    <rect x="14" y="80" width="25" height="12" rx="4"/>
    <rect x="14" y="96" width="25" height="12" rx="4"/>
  </g>

  <!-- правая половина: нижняя клавиша выделена — там Enter -->
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="89" y="32" width="25" height="12" rx="4"/>
    <rect x="89" y="48" width="25" height="12" rx="4"/>
    <rect x="89" y="64" width="25" height="12" rx="4"/>
    <rect x="89" y="80" width="25" height="12" rx="4"/>
  </g>
  <rect x="89" y="96" width="25" height="12" rx="4" fill="#50fa7b"/>
</svg>
